<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      background: #0f0f0f;
      color: #eee;
    }
    h2 { font-size: 16px; margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; color: #aaa; font-size: 12px; }
    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #222;
      color: #eee;
      font-size: 13px;
      outline: none;
    }
    input:focus { border-color: #3ea6ff; }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: #3ea6ff;
      color: #0f0f0f;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button:hover { background: #65b8ff; }
    #status {
      margin-top: 8px;
      font-size: 12px;
      min-height: 18px;
    }
    #status.ok { color: #3fb950; }
    #status.err { color: #f85149; }
    .hint {
      margin-top: 14px;
      font-size: 11px;
      color: #666;
      line-height: 1.5;
    }
    .hint a { color: #3ea6ff; text-decoration: none; }
    .hint a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h2>📝 YouTube Transcript Pro</h2>
  <label for="api-key">OpenRouter API Key</label>
  <input type="password" id="api-key" placeholder="sk-or-v1-..." spellcheck="false" />
  <button id="save">Save Key</button>
  <div id="status"></div>
  <div class="hint">
    Get a free key at <a href="https://openrouter.ai/keys" target="_blank">openrouter.ai/keys</a>
    — no credit card required. Without a key, transcripts still work (AI features disabled).
  </div>
  <script src="popup.js"></script>
</body>
</html>
